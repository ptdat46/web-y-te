services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthcare}
      MYSQL_USER: ${MYSQL_USER:-healthcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-healthcare}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhealthcare", "-phealthcare"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthcare}
      MYSQL_USER: ${MYSQL_USER:-healthcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-healthcare}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DRF_ANON_RATE: ${DRF_ANON_RATE:-30/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-300/min}
    volumes:
      - ./backend:/app
      - ./disease_translations.csv:/data/catalog/disease_translations.csv:ro
      - ./symptom_translations.csv:/data/catalog/symptom_translations.csv:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "python manage.py migrate && if [ \"$${DJANGO_DEBUG}\" = \"1\" ]; then python manage.py runserver 0.0.0.0:8000; else gunicorn config.wsgi:application --bind 0.0.0.0:8000; fi"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5173/api/v1
      # Used by the Vite dev server proxy to reach the Django backend inside
      # the docker network (the HTTP proxy target runs inside the container).
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mysql_data:
